networks:
  casaemdia_net:
    name: casaemdia_net

services:
  db:
    image: postgres:16-alpine
    container_name: casa-em-dia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-casa-em-dia-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-casa-em-dia-db}
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - casaemdia_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-casa-em-dia-user} -d ${POSTGRES_DB:-casa-em-dia-db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: casa-em-dia-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-casa-em-dia-user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-casa-em-dia-db}
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      PORT: 3000
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@casaemdia.com}
      FRONTEND_URL: ${FRONTEND_URL:-https://casaemdia.residuospro.com.br}
    volumes:
      - casa-em-dia_uploads:/app/uploads
    networks:
      - casaemdia_net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../../../casa-em-dia-front
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${API_URL:-https://api-casaemdia.residuospro.com.br}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
        VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY}
        VITE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID}
    container_name: casa-em-dia-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    networks:
      - casaemdia_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: casa-em-dia-cloudflared
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    command: tunnel run
    networks:
      - casaemdia_net
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  db_data:
  casa-em-dia_uploads:
    external: true
